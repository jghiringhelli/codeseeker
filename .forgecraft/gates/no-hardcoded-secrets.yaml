id: no-hardcoded-secrets
name: No hardcoded secrets in source
description: >
  No credentials, API keys, JWT secrets, passwords, or connection strings appear as literal
  values in source files. Secret detection runs on every commit. Hardcoded secrets are not
  a code smell — they are a security boundary violation. Any secret committed to version
  control is compromised by definition. Secrets must be injected via environment variables
  validated at startup, never embedded in code or committed config files.
property: Defended
tags: [any]
phase: development
trigger: commit
blocking: true
check:
  type: script
  command: >-
    git diff --staged | grep -qE '(password|secret|api_key|apikey|token|credential)\s*=\s*[^$\s]{5,}' && exit 1 || exit 0
