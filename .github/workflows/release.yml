name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.0.0)'
        required: true
        type: string
      skip_npm:
        description: 'Skip npm publish'
        type: boolean
        default: false
      skip_mcp:
        description: 'Skip MCP Registry publish'
        type: boolean
        default: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  publish-npm:
    if: ${{ !inputs.skip_npm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-registry:
    needs: [publish-npm]
    if: ${{ always() && !inputs.skip_mcp && (needs.publish-npm.result == 'success' || inputs.skip_npm) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Update server.json version
        env:
          RELEASE_VERSION: ${{ env.VERSION }}
        run: |
          VERSION=${RELEASE_VERSION#v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Wait for npm to serve the new version
        env:
          RELEASE_VERSION: ${{ env.VERSION }}
        run: |
          # The registry rejects a version it cannot see on npm yet, and npm takes a
          # moment to serve a fresh publish. Poll rather than guess at a sleep.
          V=${RELEASE_VERSION#v}
          for i in $(seq 1 20); do
            if npm view "codeseeker@$V" version >/dev/null 2>&1; then
              echo "npm is serving codeseeker@$V"; exit 0
            fi
            echo "waiting for codeseeker@$V on npm ($i/20)"; sleep 15
          done
          echo "codeseeker@$V never appeared on npm; not registering it"; exit 1
      - name: Publish to MCP Registry
        run: |
          output=$(./mcp-publisher publish 2>&1) && echo "$output" && exit 0
          echo "$output"
          echo "$output" | grep -q "cannot publish duplicate version" && echo "Already published — skipping." && exit 0
          exit 1

  update-plugin-branch:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `/plugin install …#plugin` expects the plugin manifest at the branch ROOT
      # (.claude-plugin/plugin.json plus commands/, hooks/, skills/). Pushing master
      # wholesale published a branch with no root manifest at all. Split the subtree so
      # plugins/codeseeker/ becomes the branch root, which is exactly the shape required.
      - name: Verify plugin manifest exists
        run: test -f plugins/codeseeker/.claude-plugin/plugin.json
      - name: Publish plugins/codeseeker as the plugin branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SPLIT_SHA=$(git subtree split --prefix=plugins/codeseeker)
          git push origin "$SPLIT_SHA:refs/heads/plugin" --force

  create-release:
    needs: [publish-npm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            # npm global install
            npm install -g codeseeker

            # or run directly with npx (no install needed)
            npx codeseeker serve --mcp
            ```

            Add to your MCP config (`.vscode/mcp.json`, `.cursor/mcp.json`, etc.):

            ```json
            {
              "mcpServers": {
                "codeseeker": {
                  "command": "npx",
                  "args": ["-y", "codeseeker", "serve", "--mcp"]
                }
              }
            }
            ```

